name: Simple matrix strategy test

on:
  workflow_dispatch:

jobs:
  matrix-job:
    strategy:
      fail-fast: false
      matrix:
        dim1: [value1, value2]
        dim2: [value3, value4, value5]
    runs-on: ubuntu-slim

    name: "matrix job ${{matrix.dim1}} - ${{matrix.dim2}}"
    steps:
      - name: do step
        run: echo "${{matrix.dim1}} ${{matrix.dim2}}"
